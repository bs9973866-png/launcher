name: Build NovaCraft Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icon
        shell: pwsh
        run: ./build_icon.ps1

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NovaCraftLauncher --icon icon.ico launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Launcher-Windows
          path: dist/NovaCraft-Launcher-Setup.exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Launcher-Portable
          path: dist/NovaCraftLauncher.exe
